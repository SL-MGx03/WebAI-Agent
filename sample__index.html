<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maleesha's AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        #chat-window { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <button id="chat-toggle" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700 transition-all z-50 hover:scale-110 active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
    </button>

    <div id="chat-window" class="fixed bottom-24 right-6 w-80 md:w-96 h-[550px] bg-white rounded-2xl shadow-2xl flex flex-col hidden z-50 overflow-hidden border border-gray-200">
        <div class="bg-blue-600 p-4 text-white flex justify-between items-center shrink-0">
            <div>
                <h3 class="font-bold text-lg leading-none">Maleesha's Assistant</h3>
                <p class="text-[10px] text-blue-100 mt-1 uppercase tracking-wider">Powered by Gemini AI</p>
            </div>
            <button id="close-chat" class="text-white hover:text-gray-200 text-xl font-bold p-1">✕</button>
        </div>

        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-4 bg-gray-50 flex flex-col">
            <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 text-sm text-gray-700 max-w-[85%]">
                Hi! I'm Maleesha's AI. Ask me anything about the website or our services!
            </div>
        </div>

        <div class="p-4 border-t bg-white shrink-0">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="user-input" autocomplete="off" placeholder="Type your message..." 
                    class="flex-1 border border-gray-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition-all font-medium text-sm">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatToggle = document.getElementById('chat-toggle');
        const chatWindow = document.getElementById('chat-window');
        const closeChat = document.getElementById('close-chat');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');

        // Toggle functionality
        chatToggle.onclick = () => chatWindow.classList.toggle('hidden');
        closeChat.onclick = () => chatWindow.classList.add('hidden');

        // Automatic scrolling function
        function scrollToBottom() {
            setTimeout(() => {
                chatMessages.scrollTo({
                    top: chatMessages.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        function appendMessage(text, isUser, isError = false) {
            const msgDiv = document.createElement('div');
            
            if (isUser) {
                msgDiv.className = 'bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm ml-auto max-w-[85%] self-end';
            } else {
                msgDiv.className = `p-3 rounded-2xl rounded-tl-none shadow-sm border text-sm max-w-[85%] self-start ${isError ? 'bg-red-50 border-red-200 text-red-700' : 'bg-white border-gray-100 text-gray-700'}`;
            }
            
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, true);
            userInput.value = '';

            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'text-xs text-gray-400 italic animate-pulse ml-2';
            loadingIndicator.textContent = "Maleesha's AI is typing...";
            chatMessages.appendChild(loadingIndicator);
            scrollToBottom();

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message }) 
                });
                
                const data = await response.json();
                
                loadingIndicator.remove();

                if (data.answer) {
                    appendMessage(data.answer, false);
                } else if (data.error) {
                    appendMessage("Server Error: " + data.error, false, true);
                }
            } catch (error) {
                loadingIndicator.remove();
                appendMessage("Connection Error: Make sure your Python server is running on port 8000.", false, true);
                console.error(error);
            }
        };
    </script>
</body>
</html>
